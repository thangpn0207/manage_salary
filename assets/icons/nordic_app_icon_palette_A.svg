<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- App Exact Color Palette -->
    <!-- Light bg: #F8FAFC, Dark bg: #0F172A, Accent Emerald: #10B981, Accent Amber: #F59E0B, Surface card: #1E293B / #FFFFFF -->
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Base Squircle: App Light Background (#F8FAFC) with ultra-fine border -->
  <rect width="512" height="512" rx="128" fill="#F8FAFC"/>
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#E2E8F0" stroke-width="4"/>

  <!-- 2. Floating Timecard Calendar Slab: App Surface Dark Card (#1E293B) -->
  <g filter="url(#card-shadow)">
    <rect x="96" y="104" width="320" height="312" rx="48" fill="#1E293B"/>
    
    <!-- Calendar Top Bar (#0F172A) -->
    <rect x="96" y="104" width="320" height="76" rx="48" fill="#0F172A"/>
    
    <!-- Binding Rings / Pins (#64748B) -->
    <rect x="168" y="88" width="20" height="36" rx="10" fill="#64748B"/>
    <rect x="324" y="88" width="20" height="36" rx="10" fill="#64748B"/>

    <!-- Shift Calendar Workday Grid Dots -->
    <!-- Row 1 -->
    <circle cx="156" cy="232" r="14" fill="#334155"/>
    <circle cx="216" cy="232" r="14" fill="#334155"/>
    <circle cx="276" cy="232" r="14" fill="#334155"/>
    <circle cx="336" cy="232" r="14" fill="#334155"/>

    <!-- Row 2 -->
    <circle cx="156" cy="292" r="14" fill="#334155"/>
    <circle cx="216" cy="292" r="14" fill="#334155"/>
    <circle cx="276" cy="292" r="14" fill="#334155"/>
    <circle cx="336" cy="292" r="14" fill="#334155"/>

    <!-- Row 3 (Checked shifts in Emerald #10B981) -->
    <circle cx="156" cy="352" r="14" fill="#334155"/>
    <circle cx="216" cy="352" r="14" fill="#334155"/>
  </g>

  <!-- 3. The Bold Nordic Emerald Checkmark (#10B981) -->
  <path d="M188 280 L250 342 L394 168" stroke="#10B981" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. The Salary Payday Coin (#F59E0B) with Ambient Glow -->
  <g filter="url(#coin-shadow)">
    <!-- Golden Amber Base (#F59E0B) -->
    <circle cx="368" cy="352" r="56" fill="#F59E0B"/>
    <circle cx="368" cy="352" r="46" stroke="#FEF3C7" stroke-width="4" stroke-opacity="0.7"/>
    
    <!-- Coin Currency Symbol (Minimal Geometric $) in White (#FFFFFF) -->
    <path d="M368 324 V380 M354 338 C354 330 382 330 382 342 C382 356 354 352 354 366 C354 378 382 378 382 370" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
