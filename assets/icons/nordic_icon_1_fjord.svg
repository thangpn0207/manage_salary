<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="g1-check" x1="180" y1="180" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="g1-coin" x1="320" y1="280" x2="420" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow-d1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Outer Squircle Frame -->
  <rect width="512" height="512" rx="128" fill="url(#g1-bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Main Calendar Slab (Nordic Deep Slate) -->
  <g filter="url(#shadow-d1)">
    <rect x="96" y="112" width="320" height="304" rx="44" fill="#0F172A"/>
    
    <!-- Calendar Header Line -->
    <rect x="96" y="112" width="320" height="72" rx="44" fill="#1E293B"/>
    <!-- Calendar Pins -->
    <circle cx="176" cy="112" r="16" fill="#64748B"/>
    <circle cx="336" cy="112" r="16" fill="#64748B"/>

    <!-- Calendar Shift Matrix Dots (Nordic Minimal Pattern) -->
    <circle cx="160" cy="240" r="12" fill="#334155"/>
    <circle cx="224" cy="240" r="12" fill="#334155"/>
    <circle cx="288" cy="240" r="12" fill="#334155"/>
    <circle cx="352" cy="240" r="12" fill="#334155"/>
    
    <circle cx="160" cy="304" r="12" fill="#334155"/>
    <circle cx="224" cy="304" r="12" fill="#334155"/>
    <circle cx="160" cy="368" r="12" fill="#334155"/>
  </g>

  <!-- Bold Emerald Pine Checkmark (Punching out of the calendar) -->
  <path d="M190 286 L252 348 L396 172" stroke="url(#g1-check)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Minimalist Nordic Copper/Gold Pay Badge -->
  <g filter="url(#shadow-d1)">
    <circle cx="372" cy="356" r="54" fill="url(#g1-coin)"/>
    <circle cx="372" cy="356" r="44" stroke="#FFFBEB" stroke-width="4" stroke-opacity="0.6"/>
    <path d="M372 328 V384 M358 342 C358 334 386 334 386 346 C386 360 358 356 358 370 C358 382 386 382 386 374" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
