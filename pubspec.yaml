name: manage_salary
description: A new Flutter manager salary application.
publish_to: 'none'
version: 1.0.1+10

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  bloc: ^9.0.0 
  flutter_bloc: ^9.1.0
  hydrated_bloc: ^11.0.0
  equatable: ^2.0.5

  # UI Components
  flutter_screenutil: ^5.9.1
  flutter_svg: ^2.0.7
  flutter_form_builder: ^10.0.1
  form_builder_validators: ^11.1.2
  fl_chart: ^1.2.0
  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.1.0

  # Navigation & Routing
  go_router: ^18.0.1

  # Utilities & Services
  intl: ^0.20.2
  intl_utils: ^2.8.10
  path_provider: ^2.1.5
  logger: ^2.0.2+1
  uuid: ^4.5.1

  # Network & Connectivity
  dio: ^5.3.3
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^7.3.1

  # Local Storage
  shared_preferences: ^2.5.3
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.8.3

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  in_app_review: ^2.0.12
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  flutter_lints: ^6.0.0
  build_runner: any
  json_serializable: ^6.6.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  drift_dev: ^2.28.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/launcher_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/launcher_icon_monochrome.png"

flutter_intl:
  enabled: true # Enables Flutter Intl
  class_name: S # Name of the generated localization class
  main_locale: en # Main locale for the application
  arb_dir: lib/core/locale/l10n # Directory for ARB resource files
  output_dir: lib/core/locale/generated # Directory for generated localization files

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/launcher_icon.png
  branding: assets/icons/launcher_icon.png
  color_dark: "#0F172A"
  image_dark: assets/icons/launcher_icon.png
  branding_dark: assets/icons/launcher_icon.png

  android_12:
    image: assets/icons/launcher_icon_foreground.png
    color: "#FFFFFF"
    color_dark: "#0F172A"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#0F172A"
